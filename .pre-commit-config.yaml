repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: scripts/hooks/run-gitleaks.sh
        language: script
        pass_filenames: false

  - repo: local
    hooks:
      - id: block-env-files
        name: block committed .env files
        entry: scripts/hooks/block-env-files.sh
        language: script
        pass_filenames: false

      - id: api-lint
        name: api lint (ruff fix + format)
        entry: scripts/hooks/run-api-lint.sh
        language: script
        files: ^api/
        pass_filenames: false

      # Before the tests, which fail on a stale spec, and before the
      # frontend hook, whose typecheck generates the client from it.
      - id: api-openapi
        name: api OpenAPI spec (regenerate frontend/openapi.json)
        entry: scripts/hooks/run-api-openapi.sh
        language: script
        files: ^api/remitx_api/
        pass_filenames: false

      - id: api-tests
        name: api tests (pytest)
        entry: scripts/hooks/run-api-tests.sh
        language: script
        files: ^api/
        pass_filenames: false

      - id: frontend-lint
        name: frontend lint (prettier fix all + lint)
        entry: scripts/hooks/run-frontend-lint.sh
        language: script
        pass_filenames: false
        always_run: true
