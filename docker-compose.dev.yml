# Development stack: API, frontend, Postgres, Redis, object storage.
#
# Run in the foreground (combined logs / TUI):
#   docker compose -f docker-compose.dev.yml up --build
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# After changing POSTGRES_USER/POSTGRES_DB, reset volumes:
#   docker compose -f docker-compose.dev.yml down -v
#
# Schema is owned by Alembic (api/alembic/versions) via the one-shot `migrate`
# service. See api/alembic/README.md.

name: remitx

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # KYC documents go to Neon Object Storage in the cloud, which speaks S3.
  # MinIO speaks the same API, so the local stack needs no Neon account and
  # the application code cannot tell the two apart — only the endpoint and
  # credentials change.
  minio:
    # Official minio/minio images were pulled from Docker Hub. Chainguard's
    # rebuild is the local stand-in; it speaks the same S3 API.
    image: cgr.dev/chainguard/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:-remitx-local}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-remitx-local-secret}
      # No CORS configuration: uploads go to the API, and a document is read
      # back by an <img> or an <iframe>, neither of which is a CORS request.
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the private bucket, then exits. No public read policy is
  # applied — an identity document reachable by anyone holding its URL is the
  # single worst outcome available here.
  minio-setup:
    # Same image as the server: it ships `mc`, and the dedicated client image
    # is distroless (no shell to chain alias / mb / anonymous).
    image: cgr.dev/chainguard/minio
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-kyc-documents}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-remitx-local}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-remitx-local-secret}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${OBJECT_STORAGE_ACCESS_KEY_ID} $${OBJECT_STORAGE_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/$${OBJECT_STORAGE_BUCKET} &&
      mc anonymous set none local/$${OBJECT_STORAGE_BUCKET}
      "

  # One-shot: applies Alembic migrations, then exits. The api and worker
  # services wait for it to complete, so neither boots on a stale schema.
  migrate:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VIRTUAL_ENV: /opt/venv
    command: sh -c "[ -x /opt/venv/bin/python ] || python -m venv /opt/venv; /opt/venv/bin/pip install -e . && /opt/venv/bin/alembic upgrade head"
    volumes:
      - ./api:/app
      - pip_cache:/root/.cache/pip
      - api_venv:/opt/venv
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      VIRTUAL_ENV: /opt/venv
      # Two endpoints because they genuinely differ here: the API reaches
      # MinIO over the compose network, the browser over the published port.
      # The host is part of the SigV4 signature, so a URL signed for the wrong
      # one fails with a 403 that names nothing.
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./api:/app
      # Same idea as frontend_node_modules: the bind mount hides the image
      # install, so keep wheels + the venv outside /app. `pip install -e .`
      # then no-ops already-satisfied deps instead of fetching everything.
      - pip_cache:/root/.cache/pip
      - api_venv:/opt/venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    command: sh -c "[ -x /opt/venv/bin/python ] || python -m venv /opt/venv; /opt/venv/bin/pip install -e . && /opt/venv/bin/python -m remitx_api"
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    stdin_open: true
    tty: true

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      VIRTUAL_ENV: /opt/venv
    volumes:
      - ./api:/app
      - pip_cache:/root/.cache/pip
      - api_venv:/opt/venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: sh -c "[ -x /opt/venv/bin/python ] || python -m venv /opt/venv; /opt/venv/bin/pip install -e . && /opt/venv/bin/celery -A remitx_worker.celery_app worker --loglevel=info"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
  pip_cache:
  api_venv:
