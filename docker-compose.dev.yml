# Development stack: API, frontend, Postgres, Redis.
#
# Run in the foreground (combined logs / TUI):
#   docker compose -f docker-compose.dev.yml up --build
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# After changing POSTGRES_USER/POSTGRES_DB, reset volumes:
#   docker compose -f docker-compose.dev.yml down -v
#
# Schema is owned by Alembic (api/alembic/versions) via the one-shot `migrate`
# service. See api/alembic/README.md.

name: remitx

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies Alembic migrations, then exits. The api and worker
  # services wait for it to complete, so neither boots on a stale schema.
  migrate:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: sh -c "pip install -e . && alembic upgrade head"
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: sh -c "pip install -e . && python -m remitx_api"
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    stdin_open: true
    tty: true

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: sh -c "pip install -e . && celery -A remitx_worker.celery_app worker --loglevel=info"

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
