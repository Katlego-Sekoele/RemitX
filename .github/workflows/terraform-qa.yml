name: Terraform QA

on:
  pull_request:
    branches: [qa]
    paths: ["infra/**"]
  push:
    branches: [qa]
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: qa
    env:
      TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
      TF_VAR_clerk_secret_key: ${{ secrets.TF_VAR_clerk_secret_key }}
      TF_VAR_clerk_publishable_key: ${{ secrets.TF_VAR_clerk_publishable_key }}
      TF_VAR_clerk_jwks_url: ${{ secrets.TF_VAR_clerk_jwks_url }}
      TF_VAR_xrpl_encryption_key: ${{ secrets.TF_VAR_xrpl_encryption_key }}
      TF_VAR_ghcr_org: ${{ github.repository }}
      TF_VAR_azure_deployer_object_id: ${{ vars.AZURE_DEPLOYER_OBJECT_ID }}
    defaults:
      run:
        working-directory: infra/envs/qa
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan -var-file=non-secret.tfvars
        if: github.event_name == 'pull_request'
      - run: terraform apply -auto-approve -var-file=non-secret.tfvars
        if: github.event_name == 'push'
