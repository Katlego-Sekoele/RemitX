name: Deploy

on:
  pull_request:
    branches: [main, stable]
    paths: ["infra/**"]
  push:
    branches: [main, stable]
    paths:
      - "infra/**"
      - "api/**"
      - "frontend/**"

permissions:
  id-token: write
  contents: read
  packages: write
  # dorny/paths-filter calls the GitHub API's listFiles on pull_request events
  # rather than diffing locally; without this it fails the `changes` job with
  # "Resource not accessible by integration", which skips the whole pipeline.
  pull-requests: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy_env: ${{ steps.env.outputs.deploy_env }}
      ghcr_repository: ${{ steps.ghcr.outputs.repository }}
      ghcr_owner: ${{ steps.ghcr.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - "infra/**"
            api:
              - "api/**"
            frontend:
              - "frontend/**"

      - name: Resolve deploy environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            branch="${{ github.base_ref }}"
          else
            branch="${{ github.ref_name }}"
          fi
          # `main` is the QA/integration branch, `stable` is the release
          # branch. Map explicitly and fail closed: an unrecognised branch
          # must not fall through into an environment, because the cheap
          # default here used to be `qa` and the expensive one is `prod`.
          case "$branch" in
            stable) echo "deploy_env=prod" >> "$GITHUB_OUTPUT" ;;
            main)   echo "deploy_env=qa" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::No deploy environment is mapped for branch '$branch'"
              exit 1
              ;;
          esac

      - name: Normalize GHCR repository name (must be lowercase)
        id: ghcr
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "repository=${repo}" >> "$GITHUB_OUTPUT"
          echo "owner=${repo%%/*}" >> "$GITHUB_OUTPUT"
        shell: bash

  ci:
    needs: changes
    uses: ./.github/workflows/ci.yml

  terraform:
    needs: [changes, ci]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
      TF_VAR_clerk_secret_key: ${{ secrets.TF_VAR_clerk_secret_key }}
      TF_VAR_clerk_publishable_key: ${{ secrets.TF_VAR_clerk_publishable_key }}
      TF_VAR_xrpl_encryption_key: ${{ secrets.TF_VAR_xrpl_encryption_key }}
      TF_VAR_ghcr_org: ${{ needs.changes.outputs.ghcr_repository }}
    defaults:
      run:
        working-directory: infra/envs/${{ needs.changes.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -var-file=non-secret.tfvars

      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve -var-file=non-secret.tfvars

  migrate:
    needs: [changes, ci, terraform]
    # `!cancelled()` disables the implicit success() gate GitHub adds to any
    # `if` without a status function. Without it a *skipped* `terraform` (any
    # push that does not touch infra/**) skips this job and every deploy job
    # below it, and the run still reports green — a silent no-op deploy.
    # Because that also disables the implicit CI gate, `ci` is now explicit.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      needs.changes.outputs.api == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.changes.outputs.deploy_env }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e .

      # Runs before deploy-api/deploy-worker so a failed migration blocks the
      # rollout rather than leaving a new image on a stale schema.
      - name: Apply Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: Set MIGRATIONS_DATABASE_URL on the ${{ needs.changes.outputs.deploy_env }} environment." >&2
            exit 1
          fi
          echo "before: $(alembic current 2>&1 | tail -1)"
          alembic upgrade head
          echo "after:  $(alembic current 2>&1 | tail -1)"

  deploy-api:
    needs: [changes, ci, terraform, migrate]
    # migrate shares this job's `api == 'true'` precondition, so it can never
    # legitimately be skipped here — require success outright rather than
    # leaving a hole an unmigrated deploy could pass through.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      needs.changes.outputs.api == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      DEPLOY_ENV: ${{ needs.changes.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-api:${{ env.DEPLOY_ENV }}
            ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-api:${{ github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure GHCR pull on Container App
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "ERROR: Set GHCR_PULL_TOKEN (GitHub PAT with read:packages) on the ${{ env.DEPLOY_ENV }} environment." >&2
            exit 1
          fi
          az containerapp registry set \
            --name remitx-${{ env.DEPLOY_ENV }}-api \
            --resource-group remitx-${{ env.DEPLOY_ENV }}-rg \
            --server ghcr.io \
            --username "${{ needs.changes.outputs.ghcr_owner }}" \
            --password "$GHCR_PULL_TOKEN"

      - run: |
          az containerapp update \
            --name remitx-${{ env.DEPLOY_ENV }}-api \
            --resource-group remitx-${{ env.DEPLOY_ENV }}-rg \
            --image ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-api:${{ env.DEPLOY_ENV }}

  deploy-worker:
    needs: [changes, ci, terraform, migrate]
    # migrate shares this job's `api == 'true'` precondition, so it can never
    # legitimately be skipped here — require success outright rather than
    # leaving a hole an unmigrated deploy could pass through.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      needs.changes.outputs.api == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      DEPLOY_ENV: ${{ needs.changes.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-worker:${{ env.DEPLOY_ENV }}
            ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-worker:${{ github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure GHCR pull on Container App
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "ERROR: Set GHCR_PULL_TOKEN (GitHub PAT with read:packages) on the ${{ env.DEPLOY_ENV }} environment." >&2
            exit 1
          fi
          az containerapp registry set \
            --name remitx-${{ env.DEPLOY_ENV }}-worker \
            --resource-group remitx-${{ env.DEPLOY_ENV }}-rg \
            --server ghcr.io \
            --username "${{ needs.changes.outputs.ghcr_owner }}" \
            --password "$GHCR_PULL_TOKEN"

      - run: |
          az containerapp update \
            --name remitx-${{ env.DEPLOY_ENV }}-worker \
            --resource-group remitx-${{ env.DEPLOY_ENV }}-rg \
            --image ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-worker:${{ env.DEPLOY_ENV }}

  deploy-frontend:
    needs: [changes, ci, terraform, migrate]
    # `skipped` is legitimate for migrate here: a frontend-only push has
    # api == 'false' and has no migration to run. But a *failed* migration
    # must not ship a new frontend against the old API and old schema.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: build/client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
