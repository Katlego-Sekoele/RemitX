name: Deploy

on:
  pull_request:
    branches: [qa, main]
    paths: ["infra/**"]
  push:
    branches: [qa, main]
    paths:
      - "infra/**"
      - "api/**"
      - "frontend/**"

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy_env: ${{ steps.env.outputs.deploy_env }}
      ghcr_repository: ${{ steps.ghcr.outputs.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - "infra/**"
            api:
              - "api/**"
            frontend:
              - "frontend/**"

      - name: Resolve deploy environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            branch="${{ github.base_ref }}"
          else
            branch="${{ github.ref_name }}"
          fi
          if [ "$branch" = "main" ]; then
            echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_env=qa" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize GHCR repository name (must be lowercase)
        id: ghcr
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        shell: bash

  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
      TF_VAR_clerk_secret_key: ${{ secrets.TF_VAR_clerk_secret_key }}
      TF_VAR_clerk_publishable_key: ${{ secrets.TF_VAR_clerk_publishable_key }}
      TF_VAR_clerk_jwks_url: ${{ secrets.TF_VAR_clerk_jwks_url }}
      TF_VAR_xrpl_encryption_key: ${{ secrets.TF_VAR_xrpl_encryption_key }}
      TF_VAR_azure_deployer_object_id: ${{ vars.AZURE_DEPLOYER_OBJECT_ID }}
      TF_VAR_ghcr_org: ${{ needs.changes.outputs.ghcr_repository }}
    defaults:
      run:
        working-directory: infra/envs/${{ needs.changes.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -var-file=non-secret.tfvars

      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve -var-file=non-secret.tfvars

  deploy-api:
    needs: [changes, terraform]
    if: |
      github.event_name == 'push' &&
      needs.changes.outputs.api == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      DEPLOY_ENV: ${{ needs.changes.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-api:${{ env.DEPLOY_ENV }}
            ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-api:${{ github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: |
          az containerapp update \
            --name remitx-${{ env.DEPLOY_ENV }}-api \
            --resource-group remitx-${{ env.DEPLOY_ENV }}-rg \
            --image ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-api:${{ env.DEPLOY_ENV }}

  deploy-worker:
    needs: [changes, terraform]
    if: |
      github.event_name == 'push' &&
      needs.changes.outputs.api == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      DEPLOY_ENV: ${{ needs.changes.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-worker:${{ env.DEPLOY_ENV }}
            ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-worker:${{ github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: |
          az containerapp update \
            --name remitx-${{ env.DEPLOY_ENV }}-worker \
            --resource-group remitx-${{ env.DEPLOY_ENV }}-rg \
            --image ghcr.io/${{ needs.changes.outputs.ghcr_repository }}/remitx-worker:${{ env.DEPLOY_ENV }}

  deploy-frontend:
    needs: [changes, terraform]
    if: |
      github.event_name == 'push' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: build/client
          skip_api_build: true
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
