name: Deploy

on:
  pull_request:
    branches: [main, stable]
    paths:
      - "infra/**"
      - "scripts/neon-storage/**"
  push:
    branches: [main, stable]
    paths:
      - "infra/**"
      - "scripts/neon-storage/**"
      - "api/**"
      - "frontend/**"
      # A change to the pipeline itself has to exercise the pipeline.
      - ".github/workflows/deploy.yml"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  # Manual rollout. This is the recovery lever when the services and the code
  # on them have drifted apart and there is no commit to push: it treats
  # everything as changed and applies Terraform before deploying.
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter calls the GitHub API's listFiles on pull_request events
  # rather than diffing locally; without this it fails the `changes` job with
  # "Resource not accessible by integration", which skips the whole pipeline.
  pull-requests: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.resolve.outputs.infra }}
      infra_data: ${{ steps.resolve.outputs.infra_data }}
      api: ${{ steps.resolve.outputs.api }}
      frontend: ${{ steps.resolve.outputs.frontend }}
      deploy_env: ${{ steps.resolve.outputs.deploy_env }}
      rollout: ${{ steps.resolve.outputs.rollout }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            infra:
              - "infra/**"
            infra_data:
              - "infra/data/**"
            api:
              - "api/**"
            frontend:
              - "frontend/**"

      - name: Resolve deploy scope and environment
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          FILTER_INFRA: ${{ steps.filter.outputs.infra }}
          FILTER_INFRA_DATA: ${{ steps.filter.outputs.infra_data }}
          FILTER_API: ${{ steps.filter.outputs.api }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            infra="$FILTER_INFRA"
            infra_data="$FILTER_INFRA_DATA"
            api="$FILTER_API"
            frontend="$FILTER_FRONTEND"
            rollout=false
            branch="$BASE_REF"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            infra=true
            infra_data=true
            api=true
            frontend=true
            rollout=true
            branch="$REF_NAME"
          else
            infra=true
            infra_data="$FILTER_INFRA_DATA"
            api=true
            frontend=true
            rollout=true
            branch="$REF_NAME"
          fi

          case "$branch" in
            stable) deploy_env=prod ;;
            main)   deploy_env=qa ;;
            *)
              echo "::error::No deploy environment is mapped for branch '$branch'"
              exit 1
              ;;
          esac

          {
            echo "infra=$infra"
            echo "infra_data=$infra_data"
            echo "api=$api"
            echo "frontend=$frontend"
            echo "rollout=$rollout"
            echo "deploy_env=$deploy_env"
          } >> "$GITHUB_OUTPUT"

          echo "$branch -> $deploy_env (rollout=$rollout, infra_data=$infra_data)"

  ci:
    needs: changes
    uses: ./.github/workflows/ci.yml

  terraform:
    needs: [changes, ci]
    if: needs.changes.outputs.rollout == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_tfe_token: ${{ secrets.TF_API_TOKEN }}
      # Actions resolves organization + repository + selected environment
      # variables here. Scripts use this instead of calling the Variables API.
      GITHUB_VARIABLES_JSON: ${{ toJSON(vars) }}
      TF_VAR_gcloud_application_default_credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
      TF_VAR_upstash_api_key: ${{ secrets.TF_VAR_upstash_api_key }}
      TF_VAR_redis_url: ${{ secrets.TF_VAR_redis_url }}
      TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
      TF_VAR_clerk_secret_key: ${{ secrets.TF_VAR_clerk_secret_key }}
      TF_VAR_xrpl_encryption_key: ${{ secrets.TF_VAR_xrpl_encryption_key }}
      TF_VAR_platform_wallet_seed_encrypted: ${{ secrets.TF_VAR_platform_wallet_seed_encrypted }}
      TF_VAR_exchange_rate_api_key: ${{ secrets.TF_VAR_exchange_rate_api_key }}
      TF_VAR_object_storage_access_key_id: ${{ secrets.TF_VAR_object_storage_access_key_id }}
      TF_VAR_object_storage_secret_access_key: ${{ secrets.TF_VAR_object_storage_secret_access_key }}
      TF_VAR_evm_encryption_key: ${{ secrets.TF_VAR_evm_encryption_key }}
      TF_VAR_evm_treasury_key_encrypted: ${{ secrets.TF_VAR_evm_treasury_key_encrypted }}
      TF_VAR_evm_stokvel_admin_key_encrypted: ${{ secrets.TF_VAR_evm_stokvel_admin_key_encrypted }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Load GitHub environment variables for Terraform
        run: ./scripts/github-tf-env.sh "${{ needs.changes.outputs.deploy_env }}" >> "$GITHUB_ENV"

      - name: Require GitHub environment config
        env:
          DEPLOY_ENV: ${{ needs.changes.outputs.deploy_env }}
          INFRA_DATA: ${{ needs.changes.outputs.infra_data }}
          ROLLOUT: ${{ needs.changes.outputs.rollout }}
        run: |
          ./scripts/github-tf-env-check.sh "$DEPLOY_ENV"
          missing=()
          [ -n "${TF_TOKEN_app_terraform_io}" ]   || missing+=("TF_API_TOKEN")
          [ -n "${TF_VAR_gcloud_application_default_credentials_json}" ] || missing+=("GOOGLE_CREDENTIALS (secret)")
          [ -n "${TF_VAR_gcp_project_id}" ]       || missing+=("GCP_PROJECT_ID (variable)")
          [ -n "${TF_VAR_hcp_organization}" ]     || missing+=("TF_CLOUD_ORGANIZATION (variable)")
          if [ "$ROLLOUT" = "true" ] || [ "$INFRA_DATA" = "true" ]; then
            [ -n "${NEON_API_KEY}" ] || missing+=("NEON_API_KEY (secret)")
            [ -n "${TF_VAR_neon_project_id}" ] || missing+=("NEON_PROJECT_ID (variable)")
          fi
          [ -n "${TF_VAR_upstash_api_key}" ]      || missing+=("TF_VAR_upstash_api_key (secret)")
          [ -n "${TF_VAR_upstash_email}" ]        || missing+=("TF_VAR_upstash_email (variable)")
          if [ "$DEPLOY_ENV" = "prod" ]; then
            [ -n "${TF_VAR_redis_url}" ] || missing+=("TF_VAR_redis_url (secret; reuse QA Redis URL)")
          fi
          [ -n "${TF_VAR_database_url}" ]         || missing+=("TF_VAR_database_url (secret)")
          [ -n "${TF_VAR_clerk_secret_key}" ]     || missing+=("TF_VAR_clerk_secret_key (secret)")
          [ -n "${TF_VAR_clerk_publishable_key}" ]|| missing+=("TF_VAR_clerk_publishable_key (variable)")
          [ -n "${TF_VAR_xrpl_encryption_key}" ]  || missing+=("TF_VAR_xrpl_encryption_key")
          [ -n "${TF_VAR_platform_wallet_seed_encrypted}" ] || missing+=("TF_VAR_platform_wallet_seed_encrypted")
          [ -n "${TF_VAR_exchange_rate_api_key}" ] || missing+=("TF_VAR_exchange_rate_api_key")
          [ -n "${TF_VAR_platform_wallet_address}" ] || missing+=("TF_VAR_platform_wallet_address")
          [ -n "${TF_VAR_fixed_fee_zar}" ] || missing+=("TF_VAR_fixed_fee_zar")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing on '${DEPLOY_ENV}' (variables via github-tf-env.sh, secrets in deploy.yml): ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.rollout == 'true'
        with:
          node-version: "22"

      - name: Install Neon CLI
        if: needs.changes.outputs.rollout == 'true'
        run: npm install --global neon@latest

      - name: Neon object storage (verify)
        if: needs.changes.outputs.rollout == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ needs.changes.outputs.deploy_env == 'qa' && vars.NEON_QA_BRANCH_ID || vars.NEON_PROD_BRANCH_ID }}
        run: make -C infra neon-storage-verify ENV=${{ needs.changes.outputs.deploy_env }}

      - name: Terraform data (Neon)
        if: needs.changes.outputs.infra_data == 'true'
        env:
          ROLLOUT: ${{ needs.changes.outputs.rollout }}
          ENV: ${{ needs.changes.outputs.deploy_env }}
        run: |
          if [ "$ROLLOUT" = "true" ]; then
            make -C infra data-apply-ci ENV="$ENV"
          else
            make -C infra data-plan ENV="$ENV"
          fi

      - name: Terraform GCP
        env:
          ROLLOUT: ${{ needs.changes.outputs.rollout }}
          DEPLOY_ENV: ${{ needs.changes.outputs.deploy_env }}
        run: |
          if [ "$ROLLOUT" = "true" ]; then
            make -C infra gcp-apply-ci ENV="$DEPLOY_ENV"
          else
            make -C infra gcp-plan ENV="$DEPLOY_ENV"
          fi

  migrate:
    needs: [changes, ci, terraform]
    # `!cancelled()` disables the implicit success() gate GitHub adds to any
    # `if` without a status function, so the conditions below are the only
    # thing deciding whether this runs.
    #
    # `terraform` must have *succeeded*, not merely not-failed: it is what
    # creates and configures the services these deploys target, so rolling
    # code onto infrastructure that failed to converge is how a green run
    # produces a broken environment.
    # Runs on every rollout. Alembic is a no-op when already at head, and
    # skipping it on a non-api/** push also skipped the deploys that
    # `needs: migrate`.
    if: |
      !cancelled() &&
      needs.changes.outputs.rollout == 'true' &&
      needs.ci.result == 'success' &&
      needs.terraform.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.changes.outputs.deploy_env }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e .

      - name: Apply Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          DEPLOY_ENV: ${{ needs.changes.outputs.deploy_env }}
          # The treasury-funding migration (a77cbaf94587) reads the platform
          # wallet's uctusd balance from the testnet once. The terraform job
          # already refuses to run with any of these unset.
          PLATFORM_WALLET_ADDRESS: ${{ vars.TF_VAR_platform_wallet_address }}
          XRPL_TESTNET_URL: ${{ vars.TF_VAR_xrpl_testnet_url }}
          UCTUSD_ISSUER: ${{ vars.TF_VAR_uctusd_issuer }}
          UCTUSD_CURRENCY_CODE_HEX: ${{ vars.TF_VAR_uctusd_currency_code_hex }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set MIGRATIONS_DATABASE_URL on the '${DEPLOY_ENV}' GitHub environment."
            exit 1
          fi
          echo "before: $(alembic current 2>&1 | tail -1)"
          alembic upgrade head
          echo "after:  $(alembic current 2>&1 | tail -1)"

  deploy-api:
    needs: [changes, ci, terraform, migrate]
    if: |
      !cancelled() &&
      needs.changes.outputs.rollout == 'true' &&
      needs.ci.result == 'success' &&
      needs.terraform.result == 'success' &&
      needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      DEPLOY_ENV: ${{ needs.changes.outputs.deploy_env }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: africa-south1
      SERVICE_ROLE: api
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3

      - name: Rollout preflight
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ needs.changes.outputs.deploy_env == 'qa' && vars.NEON_QA_BRANCH_ID || vars.NEON_PROD_BRANCH_ID }}
        run: make -C deploy preflight

      - name: Build and push API image
        env:
          AR_REPO: ${{ vars.GCP_ARTIFACT_REGISTRY_REPO }}
          GITHUB_SHA: ${{ github.sha }}
        run: make -C deploy push-api

      - run: make -C deploy deploy-cloud-run

  deploy-worker:
    needs: [changes, ci, terraform, migrate]
    if: |
      !cancelled() &&
      needs.changes.outputs.rollout == 'true' &&
      needs.ci.result == 'success' &&
      needs.terraform.result == 'success' &&
      needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      DEPLOY_ENV: ${{ needs.changes.outputs.deploy_env }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: africa-south1
      SERVICE_ROLE: worker
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3

      - name: Rollout preflight
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ needs.changes.outputs.deploy_env == 'qa' && vars.NEON_QA_BRANCH_ID || vars.NEON_PROD_BRANCH_ID }}
        run: make -C deploy preflight

      - name: Build and push worker image
        env:
          AR_REPO: ${{ vars.GCP_ARTIFACT_REGISTRY_REPO }}
          GITHUB_SHA: ${{ github.sha }}
        run: make -C deploy push-worker

      - run: make -C deploy deploy-cloud-run

  deploy-frontend:
    needs: [changes, ci, terraform, migrate]
    if: |
      !cancelled() &&
      needs.changes.outputs.rollout == 'true' &&
      needs.ci.result == 'success' &&
      needs.terraform.result == 'success' &&
      needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      DEPLOY_ENV: ${{ needs.changes.outputs.deploy_env }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: hashicorp/setup-terraform@v3

      - name: Rollout preflight
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ needs.changes.outputs.deploy_env == 'qa' && vars.NEON_QA_BRANCH_ID || vars.NEON_PROD_BRANCH_ID }}
        run: make -C deploy preflight

      - run: npm install -g firebase-tools

      - run: make -C deploy deploy-frontend
