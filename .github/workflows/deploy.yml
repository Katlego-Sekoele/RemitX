name: Deploy

on:
  pull_request:
    branches: [main, stable]
    paths: ["infra/**"]
  push:
    branches: [main, stable]
    paths:
      - "infra/**"
      - "api/**"
      - "frontend/**"

permissions:
  contents: read
  # dorny/paths-filter calls the GitHub API's listFiles on pull_request events
  # rather than diffing locally; without this it fails the `changes` job with
  # "Resource not accessible by integration", which skips the whole pipeline.
  pull-requests: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy_env: ${{ steps.env.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - "infra/**"
            api:
              - "api/**"
            frontend:
              - "frontend/**"

      - name: Resolve deploy environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            branch="${{ github.base_ref }}"
          else
            branch="${{ github.ref_name }}"
          fi
          case "$branch" in
            stable) echo "deploy_env=prod" >> "$GITHUB_OUTPUT" ;;
            main)   echo "deploy_env=qa" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::No deploy environment is mapped for branch '$branch'"
              exit 1
              ;;
          esac

  ci:
    needs: changes
    uses: ./.github/workflows/ci.yml

  terraform:
    needs: [changes, ci]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_VAR_hcp_organization: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_tfe_token: ${{ secrets.TF_API_TOKEN }}
      # HCP remote runs forward TF_VAR_* as Terraform inputs, not RENDER_*.
      TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
      TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
      TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
      TF_VAR_clerk_secret_key: ${{ secrets.TF_VAR_clerk_secret_key }}
      TF_VAR_clerk_publishable_key: ${{ secrets.TF_VAR_clerk_publishable_key }}
      TF_VAR_xrpl_encryption_key: ${{ secrets.TF_VAR_xrpl_encryption_key }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Require HCP organization and Render credentials
        run: |
          if [ -z "${TF_CLOUD_ORGANIZATION}" ]; then
            echo "ERROR: Set repository or environment variable TF_CLOUD_ORGANIZATION." >&2
            exit 1
          fi
          if [ -z "${TF_VAR_render_api_key}" ] || [ -z "${TF_VAR_render_owner_id}" ]; then
            echo "ERROR: Set RENDER_API_KEY and RENDER_OWNER_ID on the ${{ needs.changes.outputs.deploy_env }} environment." >&2
            exit 1
          fi

      # Env roots read remitx-shared via terraform_remote_state. A PR-only
      # plan leaves that workspace empty, so apply shared on every run.
      - name: Terraform shared
        working-directory: infra/shared
        run: |
          terraform init
          terraform apply -auto-approve -var-file=non-secret.tfvars

      - name: Terraform environment
        working-directory: infra/envs/${{ needs.changes.outputs.deploy_env }}
        run: |
          terraform init
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            terraform plan -var-file=non-secret.tfvars
          else
            terraform apply -auto-approve -var-file=non-secret.tfvars
          fi

  migrate:
    needs: [changes, ci, terraform]
    # `!cancelled()` disables the implicit success() gate GitHub adds to any
    # `if` without a status function. Without it a *skipped* `terraform` (any
    # push that does not touch infra/**) skips this job and every deploy job
    # below it, and the run still reports green — a silent no-op deploy.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      needs.changes.outputs.api == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.changes.outputs.deploy_env }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e .

      - name: Apply Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: Set MIGRATIONS_DATABASE_URL on the ${{ needs.changes.outputs.deploy_env }} environment." >&2
            exit 1
          fi
          echo "before: $(alembic current 2>&1 | tail -1)"
          alembic upgrade head
          echo "after:  $(alembic current 2>&1 | tail -1)"

  deploy-api:
    needs: [changes, ci, terraform, migrate]
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      needs.changes.outputs.api == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_NAME: remitx-${{ needs.changes.outputs.deploy_env }}-api
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/render-deploy.sh

  deploy-worker:
    needs: [changes, ci, terraform, migrate]
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      needs.changes.outputs.api == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_NAME: remitx-${{ needs.changes.outputs.deploy_env }}-worker
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/render-deploy.sh

  deploy-frontend:
    needs: [changes, ci, terraform, migrate]
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.changes.outputs.deploy_env }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_NAME: remitx-${{ needs.changes.outputs.deploy_env }}-web
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/render-deploy.sh
