name: CI

on:
  pull_request:
  push:
    branches: [qa, main]
  workflow_call:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # Migrations are the one thing pytest cannot cover: the suite builds its
      # schema from Base.metadata on SQLite and never touches alembic/versions,
      # so a broken migration would otherwise first surface in the QA deploy.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check remitx_api remitx_worker tests alembic

      - name: Pytest
        run: pytest

      - name: Migrations apply, and the ORM still matches them
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint
