name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, stable]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Each check runs only when a path it covers changed. A manual run
  # (workflow_dispatch) executes all of them. Deploy calls this workflow, and
  # github.event_name there is still the caller's event, so the same filters
  # apply on the way to a rollout.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.resolve.outputs.api }}
      frontend: ${{ steps.resolve.outputs.frontend }}
      contracts: ${{ steps.resolve.outputs.contracts }}
      seeder: ${{ steps.resolve.outputs.seeder }}
      deploy_scripts: ${{ steps.resolve.outputs.deploy_scripts }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            api:
              - "api/**"
              # The worker ABI is a copy of this file; an API test fails if they differ.
              - "contracts/abi/**"
              - ".github/workflows/ci.yml"
            frontend:
              - "frontend/**"
              - ".github/workflows/ci.yml"
            contracts:
              - "contracts/**"
              - ".github/workflows/ci.yml"
            seeder:
              # The seeder drives the real backend, so an API change can break it.
              - "api/**"
              - "tools/seeder/**"
              - "tools/loadtest/**"
              - ".github/workflows/ci.yml"
            deploy_scripts:
              - "deploy/**"
              - "scripts/**"
              - ".github/scripts/**"
              - ".github/workflows/ci.yml"
              - ".github/workflows/deploy.yml"
              - "infra/Makefile"

      - name: Resolve which checks run
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          API: ${{ steps.filter.outputs.api }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          CONTRACTS: ${{ steps.filter.outputs.contracts }}
          SEEDER: ${{ steps.filter.outputs.seeder }}
          DEPLOY_SCRIPTS: ${{ steps.filter.outputs.deploy_scripts }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            api=true
            frontend=true
            contracts=true
            seeder=true
            deploy_scripts=true
          else
            api="$API"
            frontend="$FRONTEND"
            contracts="$CONTRACTS"
            seeder="$SEEDER"
            deploy_scripts="$DEPLOY_SCRIPTS"
          fi
          {
            echo "api=$api"
            echo "frontend=$frontend"
            echo "contracts=$contracts"
            echo "seeder=$seeder"
            echo "deploy_scripts=$deploy_scripts"
          } >> "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # The default pytest lane builds its schema from Base.metadata on SQLite
      # and never touches alembic/versions, so a broken migration would
      # otherwise first surface in the QA deploy. The `postgres` lane
      # (TEST_DATABASE_URL) makes its own migrated database here for what
      # SQLite can't show, such as row locks.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so PR jobs can rebase onto the base branch.
          fetch-depth: 0

      - name: Rebase onto base branch (linear history)
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.email "ci@localhost"
          git config user.name "ci"
          git fetch origin "${{ github.base_ref }}"
          git rebase "origin/${{ github.base_ref }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check remitx_api remitx_worker tests alembic

      - name: Pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: pytest

      - name: Single Alembic head
        run: |
          set -euo pipefail
          count="$(alembic heads | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "::error::Expected exactly one Alembic head, found ${count}:"
            alembic heads
            exit 1
          fi

      - name: Migrations apply, and the ORM still matches them
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: |
          alembic upgrade head
          alembic check

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contract dependencies
        run: npm ci

      - name: Hardhat tests
        run: npm test

  # The QA seeder (tools/seeder) drives the real backend: its controllers,
  # services and worker tasks. Running its tests here means a backend change
  # that breaks the seeder fails the PR that made it, not a developer's seed
  # run weeks later. CI never seeds a real environment: Clerk, storage and the
  # EVM chain are faked, and the database is thrown away.
  seeder:
    needs: changes
    if: needs.changes.outputs.seeder == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/seeder
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the API and the seeder
        run: pip install -e ../../api -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest (a real seed run against a throwaway Postgres)
        env:
          SEEDER_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: pytest

      # The load test's scripts import the backend and the seeder too, so a
      # rename that would break `make loadtest` fails here instead.
      - name: Load test scripts (tools/loadtest)
        working-directory: tools/loadtest
        run: |
          ruff check .
          ruff format --check .
          pytest

  deploy-scripts:
    needs: changes
    if: needs.changes.outputs.deploy_scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (deploy scripts + neon-storage)
        run: |
          bash -n scripts/neon-storage/ensure.sh
          bash -n scripts/github-tf-env-lib.sh
          bash -n scripts/github-tf-env.sh
          bash -n scripts/github-tf-env-check.sh
          bash -n scripts/github-tf-secrets-from-env.sh
          bash -n .github/scripts/gcp-deploy-cloud-run.sh
          bash -n .github/scripts/gcp-deploy-firebase.sh
          bash -n .github/scripts/gcp-preflight-rollout.sh

      - name: Deploy Makefiles
        run: make -C deploy help && make -C infra help

      - name: Cloud Run env file writer
        run: |
          JSON="$(mktemp)"
          OUT="$(mktemp)"
          printf '%s' '{"KEY":"a=b","MULTILINE":"first\nsecond","EMPTY":null}' >"$JSON"
          python3 .github/scripts/gcp-write-cloud-run-env.py "$JSON" "$OUT"
          python3 -c '
          import json, sys
          assert json.load(open(sys.argv[1])) == {
              "KEY": "a=b",
              "MULTILINE": "first\nsecond",
          }
          ' "$OUT"
