name: CI

on:
  pull_request:
  push:
    branches: [main, stable]
  workflow_call:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # Migrations are the one thing pytest cannot cover: the suite builds its
      # schema from Base.metadata on SQLite and never touches alembic/versions,
      # so a broken migration would otherwise first surface in the QA deploy.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check remitx_api remitx_worker tests alembic

      - name: Pytest
        run: pytest

      - name: Migrations apply, and the ORM still matches them
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

  # The QA seeder (tools/seeder) drives the real backend: its controllers,
  # services and worker tasks. Running its tests here means a backend change
  # that breaks the seeder fails the PR that made it, not a developer's seed
  # run weeks later. CI never seeds a real environment: Clerk, storage and the
  # XRPL are faked, and the database is thrown away.
  seeder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/seeder
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the API and the seeder
        run: pip install -e ../../api -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest (a real seed run against a throwaway Postgres)
        env:
          SEEDER_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: pytest

  # The living product docs (frontend/living-docs/README.md). The brief's
  # pipeline in order: the generated sources are current, every reference the
  # docs make resolves against them, and Storybook builds. On a PR, the job
  # summary also lists what its API and schema changes touch in the docs.
  docs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    defaults:
      run:
        # Explicit, so a pipe into the job summary keeps the check's exit code.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The impact report compares against the PR's base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the API and the frontend
        run: |
          pip install -e api
          npm ci --prefix frontend

      - name: OpenAPI spec is current
        working-directory: api
        run: python scripts/export_openapi.py --check

      # Migrates a throwaway database on the service and reads it with the
      # dbdiagram CLI. A migration without a regenerated schema fails here.
      - name: DBML schema is current
        env:
          DBML_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: scripts/generate-dbml.sh --check

      - name: Every docs reference resolves
        working-directory: frontend
        run: npm run --silent docs:check -- --format markdown | tee -a "$GITHUB_STEP_SUMMARY"

      - name: What this PR's API and schema changes touch
        if: github.event_name == 'pull_request'
        working-directory: frontend
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run --silent docs:impact -- --base "origin/$BASE_REF" --format markdown >> "$GITHUB_STEP_SUMMARY"

      # What the Render static site builds: the app, with Storybook at
      # /storybook/ for the admin app's Docs page.
      - name: Build the site with Storybook
        working-directory: frontend
        run: npm run build:site

      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: frontend/build/client/storybook
          retention-days: 7
