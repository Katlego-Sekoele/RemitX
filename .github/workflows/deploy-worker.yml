name: Deploy Worker

on:
  push:
    branches: [qa, main]
    paths: ["api/**"]

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize GHCR repository name (must be lowercase)
        id: ghcr
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.repository }}/remitx-worker:${{ env.DEPLOY_ENV }}
            ghcr.io/${{ steps.ghcr.outputs.repository }}/remitx-worker:${{ github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: |
          az containerapp update \
            --name remitx-${{ env.DEPLOY_ENV }}-worker \
            --resource-group remitx-${{ env.DEPLOY_ENV }}-rg \
            --image ghcr.io/${{ steps.ghcr.outputs.repository }}/remitx-worker:${{ env.DEPLOY_ENV }}
