[project]
name = "remitx-api"
version = "0.1.0"
description = "RemitX JSON API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "clerk-backend-api>=7.0.0,<8",
    "xrpl-py>=4.3.0",
    # S3 client for Neon Object Storage (MinIO locally) — KYC document uploads.
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]

[project.scripts]
remitx-api = "remitx_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remitx_api", "remitx_worker"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["remitx_api", "remitx_worker", "tests", "alembic", "asgi.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Without this, isort splits every `x as y` import into its own `from
# module import (...)` block instead of grouping it with plain imports off
# the same module — e.g. two ORM modules with same-named, differently-cased
# status constants aliased on import to coexist in one file.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; generated op.* calls run long, and the pre-commit
# hook lints before it formats, so E501 here would block every migration.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI calls Depends()'s argument once per request via its own DI
# mechanism, not at function-definition time, so B008's "reused mutable
# default" concern does not apply. Only needed for non-builtin-typed
# parameters (e.g. `User`); `int`/`str` defaults like Query(...) are already
# exempt because B008 ignores immutable-annotated parameters.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
