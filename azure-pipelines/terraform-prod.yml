# Register in Azure DevOps: Pipelines → New pipeline → GitHub → this file.
# Link variable group: relyo-prod-secrets
# Service connection name must match azureServiceConnection below.

trigger:
  branches:
    include: [main]
  paths:
    include: [infra/**]

pr:
  branches:
    include: [main]
  paths:
    include: [infra/**]

variables:
  - group: relyo-prod-secrets
  - name: azureServiceConnection
    value: azure-relyo
  - name: TF_VAR_ghcr_org
    value: Katlego-Sekoele/Relyo

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      set -euo pipefail
      TERRAFORM_VERSION=1.5.7
      curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
      unzip -o /tmp/terraform.zip -d /tmp
      sudo mv /tmp/terraform /usr/local/bin/terraform
      terraform version
    displayName: Install Terraform

  - task: AzureCLI@2
    displayName: Terraform plan or apply
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        cd infra/envs/prod
        terraform init
        if [ "$(Build.Reason)" = "PullRequest" ]; then
          terraform plan -var-file=non-secret.tfvars
        else
          terraform apply -auto-approve -var-file=non-secret.tfvars
        fi
    env:
      TF_VAR_postgres_admin_password: $(TF_VAR_postgres_admin_password)
      TF_VAR_clerk_api_key: $(TF_VAR_clerk_api_key)
      TF_VAR_clerk_secret_key: $(TF_VAR_clerk_secret_key)
      TF_VAR_clerk_publishable_key: $(TF_VAR_clerk_publishable_key)
      TF_VAR_clerk_jwks_url: $(TF_VAR_clerk_jwks_url)
      TF_VAR_xrpl_encryption_key: $(TF_VAR_xrpl_encryption_key)
      TF_VAR_ghcr_org: $(TF_VAR_ghcr_org)
      TF_VAR_azure_deployer_object_id: $(AZURE_DEPLOYER_OBJECT_ID)
