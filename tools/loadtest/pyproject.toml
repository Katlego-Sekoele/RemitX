# Tool settings only. The load test is not an installable package: its scripts
# run inside the load-test stack's containers (see docker-compose.yml).

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/JS report template; wrapping every markup line for 88 cols
# makes the template harder to read than the line-length rule is worth.
"to_canvas.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
