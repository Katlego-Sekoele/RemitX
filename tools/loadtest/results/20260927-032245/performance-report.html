<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Performance testing results — compute-sweep</title>
<style>
  :root {
    --bg: #f7f7f5;
    --fg: #1a1a1a;
    --muted: #5c5c5c;
    --card: #fff;
    --border: #e2e2de;
    --danger: #b42318;
    --success: #027a48;
    --info: #175cd3;
    --warning: #b54708;
    --warning-bg: #fffaeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --fg: #f2f2f0;
      --muted: #a3a3a0;
      --card: #1e1e1c;
      --border: #333330;
      --danger: #f97066;
      --success: #6ce9a6;
      --info: #84caff;
      --warning: #fec84b;
      --warning-bg: #2a2110;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
    color: var(--fg);
    background: var(--bg);
  }
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 8px; }
  h2 { font-size: 1.15rem; font-weight: 600; margin: 0 0 8px; }
  p.muted { color: var(--muted); margin: 0 0 16px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .pill {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card);
  }
  .callout {
    background: var(--warning-bg); border: 1px solid var(--warning);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 24px;
  }
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 28px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px;
  }
  .stat .v { font-size: 1.35rem; font-weight: 600; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat.danger .v { color: var(--danger); }
  .stat.success .v { color: var(--success); }
  section { margin-bottom: 32px; }
  .chart {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; margin-top: 12px;
  }
  svg { width: 100%; height: auto; display: block; }
  table {
    width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    margin-top: 12px;
  }
  th, td {
    text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  th { font-weight: 600; color: var(--muted); font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 10px;
    font-size: 12px; color: var(--muted);
  }
  .legend i {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 6px;
  }
  footer { color: var(--muted); font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<main id="app"></main>
<script type="application/json" id="report-data">{"userCats": ["10", "25", "50", "100", "250", "500", "1000"], "latencySeries": [{"name": "small HTTP median (ms)", "data": [1100.0, 4400.0, 6700.0, 11000.0, 14000.0, 16000.0, 19000.0], "tone": "danger"}, {"name": "medium HTTP median (ms)", "data": [55.0, 61.0, 130.0, 900.0, 2100.0, 2300.0, 2500.0], "tone": "success"}, {"name": "large HTTP median (ms)", "data": [58.0, 56.0, 57.0, 73.0, 380.0, 590.0, 780.0], "tone": "info"}], "rpsSeries": [{"name": "small HTTP req/s", "data": [2.7, 2.6, 2.4, 3.900000000000001, 0.9, 1.4, 2.5], "tone": "danger"}, {"name": "medium HTTP req/s", "data": [5.099999999999999, 11.0, 10.1, 7.9, 5.4, 4.5, 0.0], "tone": "success"}, {"name": "large HTTP req/s", "data": [4.4, 13.299999999999999, 20.700000000000003, 21.0, 15.5, 0.0, 0.0], "tone": "info"}], "headline": {"worstHttpMedian": "1.1 s", "bestHttpMedian": "55 ms", "peakHttpRps": "2.5/s", "peakSettleRps": "0.00/s", "httpFailPct": "11.7%", "httpFailTone": "danger"}, "settleRows": [["small", "0.00", "9.3 s", "11.7%", "0.0%"], ["medium", "0.00", "22.0 s", "2.8%", "0.0%"], ["large", "0.00", "14.0 s", "2.2%", "0.0%"]], "endpointRows": [["/remittances", "6600", "17", "0"], ["/kyc/application", "3200", "28", "0"], ["/quotes/create-quote", "3100", "17", "0"], ["/admin/deposits/pending", "1800", "5", "0"], ["/accounts", "1100", "50", "0"]], "bottleneck": "At 10 concurrent users, HTTP median latency is 1100 ms on small (API 0.1 CPU) versus 55 ms on medium (API 1.0 CPU). That gap points to API CPU starvation under the smaller compute cap, not Postgres or the settlement queue. Calibrated RLUSD burn remains ~8.6 s p50 on Testnet; queue throughput follows worker capacity and burn delay.", "profileName": "compute-sweep", "description": "Three compute tiers after one seed: API/worker/Postgres scale together (0.1\u21921\u21922 CPU for app services; Postgres 0.5\u21921\u21922 CPU).", "burnP50": 8.61, "burnP95": 10.24, "computeLabels": "small (API 0.1 / worker 0.1 / pg 0.5 CPU), medium (API 1.0 / worker 1.0 / pg 1.0 CPU), large (API 2.0 / worker 2.0 / pg 2.0 CPU)", "locustSteps": [10, 25, 50, 100, 250, 500, 1000]}</script>
<script>
const data = JSON.parse(document.getElementById("report-data").textContent);
const tones = { danger: "var(--danger)", success: "var(--success)", info: "var(--info)", warning: "var(--warning)" };

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function lineChart(series, cats, height) {
  const W = 880, H = height, pad = { t: 16, r: 16, b: 36, l: 56 };
  const vals = series.flatMap(s => s.data.filter(v => v != null));
  const maxY = Math.max(...vals, 1) * 1.08;
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  const x = i => pad.l + (cats.length <= 1 ? innerW/2 : i * innerW / (cats.length - 1));
  const y = v => pad.t + innerH - (v / maxY) * innerH;
  const grid = [0, 0.25, 0.5, 0.75, 1].map(t => {
    const yy = pad.t + innerH * (1 - t);
    const label = Math.round(maxY * t);
    return `<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="var(--border)"/>` +
      `<text x="${pad.l-8}" y="${yy+4}" text-anchor="end" fill="var(--muted)" font-size="11">${label}</text>`;
  }).join("");
  const paths = series.map(s => {
    const pts = s.data.map((v, i) => `${x(i)},${y(v == null ? 0 : v)}`).join(" ");
    const color = tones[s.tone] || "var(--fg)";
    return `<polyline fill="none" stroke="${color}" stroke-width="2.5" points="${pts}"/>` +
      s.data.map((v, i) => v == null ? "" :
        `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${color}"/>`).join("");
  }).join("");
  const labels = cats.map((c, i) =>
    `<text x="${x(i)}" y="${H-10}" text-anchor="middle" fill="var(--muted)" font-size="11">${esc(c)}</text>`
  ).join("");
  const legend = series.map(s =>
    `<span><i style="background:${tones[s.tone]||'var(--fg)'}"></i>${esc(s.name)}</span>`
  ).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Latency chart">${grid}${paths}${labels}</svg><div class="legend">${legend}</div></div>`;
}

function barChart(series, cats, height) {
  const W = 880, H = height, pad = { t: 16, r: 16, b: 36, l: 56 };
  const vals = series.flatMap(s => s.data.filter(v => v != null));
  const maxY = Math.max(...vals, 1) * 1.08;
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  const groupW = innerW / cats.length;
  const barW = Math.max(4, (groupW * 0.7) / series.length);
  const grid = [0, 0.25, 0.5, 0.75, 1].map(t => {
    const yy = pad.t + innerH * (1 - t);
    const label = (maxY * t).toFixed(t === 0 || t === 1 ? 0 : 1);
    return `<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="var(--border)"/>` +
      `<text x="${pad.l-8}" y="${yy+4}" text-anchor="end" fill="var(--muted)" font-size="11">${label}</text>`;
  }).join("");
  let bars = "";
  cats.forEach((c, i) => {
    series.forEach((s, si) => {
      const v = s.data[i] == null ? 0 : s.data[i];
      const bh = (v / maxY) * innerH;
      const bx = pad.l + i * groupW + groupW * 0.15 + si * barW;
      const by = pad.t + innerH - bh;
      bars += `<rect x="${bx}" y="${by}" width="${barW}" height="${bh}" fill="${tones[s.tone]||'var(--fg)'}" rx="2"/>`;
    });
  });
  const labels = cats.map((c, i) =>
    `<text x="${pad.l + i * groupW + groupW/2}" y="${H-10}" text-anchor="middle" fill="var(--muted)" font-size="11">${esc(c)}</text>`
  ).join("");
  const legend = series.map(s =>
    `<span><i style="background:${tones[s.tone]||'var(--fg)'}"></i>${esc(s.name)}</span>`
  ).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="RPS chart">${grid}${bars}${labels}</svg><div class="legend">${legend}</div></div>`;
}

function table(headers, rows, numCols) {
  const th = headers.map((h, i) =>
    `<th class="${numCols.includes(i) ? "num" : ""}">${esc(h)}</th>`).join("");
  const body = rows.map(r =>
    `<tr>${r.map((c, i) =>
      `<td class="${numCols.includes(i) ? "num" : ""}">${esc(c)}</td>`).join("")}</tr>`
  ).join("");
  return `<table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>`;
}

const app = document.getElementById("app");
const failTone = data.headline.httpFailTone === "danger" ? "danger" : "success";
app.innerHTML = `
  <h1>Performance testing results</h1>
  <p class="muted">Profile ${esc(data.profileName)}. ${esc(data.description)} Compute: ${esc(data.computeLabels)}. Locust user steps: ${esc(data.locustSteps.join(" → "))}.</p>
  <div class="pills">
    <span class="pill">HTTP vs SETTLE split</span>
    <span class="pill">RLUSD burn p50 ${esc(data.burnP50)} s / p95 ${esc(data.burnP95)} s</span>
  </div>
  <div class="callout">${esc(data.bottleneck)}</div>
  <div class="stats">
    <div class="stat danger"><div class="v">${esc(data.headline.worstHttpMedian)}</div><div class="l">Worst HTTP median @ 10 users</div></div>
    <div class="stat success"><div class="v">${esc(data.headline.bestHttpMedian)}</div><div class="l">Best HTTP median @ 10 users</div></div>
    <div class="stat"><div class="v">${esc(data.headline.peakHttpRps)}</div><div class="l">Peak HTTP requests/s</div></div>
    <div class="stat"><div class="v">${esc(data.headline.peakSettleRps)}</div><div class="l">Peak settle throughput (end-to-end /s)</div></div>
  </div>
  <section>
    <h2>API response times under concurrent use</h2>
    <p class="muted">HTTP-only median latency (SETTLE events excluded) as Locust ramps concurrent users. One series per compute config. Users on the x-axis; median ms on the y-axis.</p>
    ${lineChart(data.latencySeries, data.userCats, 280)}
  </section>
  <section>
    <h2>Requests processed per second</h2>
    <p class="muted">HTTP request rate (SETTLE excluded) at each user-step plateau.</p>
    ${barChart(data.rpsSeries, data.userCats, 260)}
  </section>
  <section>
    <h2>Settlement: queue throughput, RLUSD time, success rates</h2>
    <p class="muted">Message-queue throughput is the Locust SETTLE “end to end” rate (settlements per second). RLUSD processing time uses the profile’s calibrated Testnet burn plus in-run “chain + confirm” medians under load.</p>
    <div class="stats">
      <div class="stat"><div class="v">${esc(data.burnP50)} s</div><div class="l">Calibrated RLUSD burn p50 (Testnet)</div></div>
      <div class="stat"><div class="v">${esc(data.burnP95)} s</div><div class="l">Calibrated RLUSD burn p95 (Testnet)</div></div>
      <div class="stat ${failTone}"><div class="v">${esc(data.headline.httpFailPct)}</div><div class="l">HTTP failure rate (all compute)</div></div>
    </div>
    ${table(
      ["Compute", "Settle /s @ peak users", "Chain+confirm median", "HTTP fail %", "Settle fail %"],
      data.settleRows,
      [1, 2, 3, 4]
    )}
  </section>
  ${data.endpointRows.length ? `
  <section>
    <h2>Slowest HTTP endpoints @ 10 users (baseline compute)</h2>
    ${table(
      ["Endpoint", "Median (ms)", "Requests", "Failures"],
      data.endpointRows,
      [1, 2, 3]
    )}
  </section>` : ""}
  <footer>Generated by tools/loadtest/to_canvas.py from Locust results. Open this file in a browser.</footer>
`;
</script>
</body>
</html>
