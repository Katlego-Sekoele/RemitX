services:
  api:
    build:
      context: ./api
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./api:/app
    command: sh -c "pip install -e . && python -m remitx_api"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  frontend_node_modules:
